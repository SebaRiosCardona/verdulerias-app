<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Panel Admin — Verdulería</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .admin-login { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--verde); }
  .tabs { display:flex; gap:6px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--gris-claro); position:sticky; top:57px; z-index:15; overflow-x:auto; }
  .tab-btn { border:none; background:var(--verde-claro); color:var(--verde-oscuro); padding:8px 14px; border-radius:20px; font-weight:600; font-size:13px; white-space:nowrap; }
  .tab-btn.activo { background:var(--verde); color:#fff; }
  main { padding:14px 16px 60px; }
  .filtros-pedidos { margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .buscador-cliente { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--gris-claro); border-radius:10px; padding:10px 12px; }
  .buscador-cliente svg { flex-shrink:0; color:var(--gris); }
  .buscador-cliente input { border:none; outline:none; flex:1; background:transparent; font-size:14px; }
  .filtros-estado { display:flex; gap:8px; }
  .filtros-estado select { flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--gris-claro); background:#fff; font-size:13px; color:var(--texto); }
  .pedido-admin { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 4px 14px rgba(0,0,0,.16), 0 2px 5px rgba(0,0,0,.10); }
  .lista-items-pedido { list-style:none; margin:8px 0; padding:0; font-size:13px; color:var(--gris); display:flex; flex-direction:column; gap:3px; }
  .lista-items-pedido li::before { content:"• "; color:var(--verde); }
  .fila-acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .fila-acciones button { border:none; padding:5px 10px; border-radius:14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
  .btn-toggle-si { background:var(--verde-claro); color:var(--verde-oscuro); }
  .btn-toggle-no { background:#fdeaea; color:var(--rojo); }
  .btn-borrar { background:#f1f1f1; color:var(--gris); margin-left:auto; text-transform:none; letter-spacing:normal; border-radius:8px; }
  .producto-admin { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:0 4px 14px rgba(0,0,0,.16), 0 2px 5px rgba(0,0,0,.10); }
  .producto-admin input[type="number"] { width:90px; padding:8px; border-radius:8px; border:1px solid var(--gris-claro); }
  .switch { position:relative; width:44px; height:24px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#f1f1f1; border-radius:24px; transition:.2s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  input:checked + .slider { background:var(--verde); }
  input:checked + .slider:before { transform:translateX(20px); }
  .btn-eliminar-producto { border:none; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#f6f6f4; color:var(--gris); cursor:pointer; flex-shrink:0; }
  .btn-eliminar-producto:hover { background:#fdeaea; color:var(--rojo); }
  .btn-agregar-producto-nuevo { width:100%; padding:12px; background:var(--verde); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:14px; margin-bottom:12px; }
  .form-nuevo-producto { background:#fff; border-radius:12px; padding:14px; margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,.16), 0 2px 5px rgba(0,0,0,.10); }
  .form-nuevo-producto label { display:block; font-size:12px; font-weight:600; color:var(--gris); margin:8px 0 4px; }
  .form-nuevo-producto input, .form-nuevo-producto select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--gris-claro); }
  .form-nuevo-producto button { margin-top:12px; width:100%; padding:11px; background:var(--verde); color:#fff; border:none; border-radius:8px; font-weight:700; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-producto { background:#fff; border-radius:16px; padding:22px; max-width:380px; width:100%; }
  .modal-producto h3 { margin:0 0 14px; color:var(--verde-oscuro); }
  .modal-producto label { display:block; font-size:12px; font-weight:600; color:var(--gris); margin:10px 0 4px; }
  .modal-producto input, .modal-producto select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--gris-claro); }
  .modal-producto-acciones { display:flex; gap:10px; margin-top:16px; }
  .modal-producto-acciones button { flex:1; padding:11px; border-radius:8px; border:none; font-weight:700; font-size:13.5px; }
  .btn-modal-cancelar { background:#f1f1f1; color:var(--gris); }
</style>
</head>
<body>

  <div id="pantalla-carga">
    <div class="spinner"></div>
  </div>

  <!-- Login admin -->
  <div id="vista-login-admin" class="admin-login oculto">
    <form id="form-login-admin" class="card-login" style="width:320px;">
      <h2 style="margin:0 0 4px;color:var(--verde-oscuro);">Panel Admin</h2>
      <p style="font-size:13px;color:var(--gris);margin:0 0 6px;" id="nombre-tienda-admin"></p>
      <label>Contraseña</label>
      <div style="position:relative;">
        <input id="input-password-admin" type="password" required style="padding-right:44px;" />
        <button type="button" id="toggle-password-admin" class="btn-toggle-password"></button>
      </div>
      <button type="submit">Entrar</button>
      <p id="error-login-admin" class="oculto" style="color:var(--rojo);font-size:13px;margin-top:10px;"></p>
    </form>
  </div>

  <!-- Panel -->
  <div id="vista-panel" class="oculto">
    <header>
      <div>
        <h1>Admin</h1>
        <div class="subtitulo" id="subtitulo-admin"></div>
      </div>
      <button id="btn-salir-admin">Salir</button>
    </header>

    <div class="tabs">
      <button class="tab-btn activo" data-tab="hoy">Pedidos de hoy</button>
      <button class="tab-btn" data-tab="pedidos">Historial de pedidos</button>
      <button class="tab-btn" data-tab="productos">Productos</button>
      <button class="tab-btn" data-tab="configuracion">Configuración</button>
    </div>

    <main>
      <!-- Tab Hoy -->
      <section id="tab-hoy">
        <div class="filtros-pedidos">
          <div class="filtros-estado">
            <select id="select-filtro-entregado-hoy">
              <option value="">Entrega: todos</option>
              <option value="si">Entregado</option>
              <option value="no">No entregado</option>
            </select>
          </div>
        </div>
        <div id="lista-pedidos-hoy"></div>
      </section>

      <!-- Tab Pedidos (todos) -->
      <section id="tab-pedidos" class="oculto">
        <div class="filtros-pedidos">
          <div class="buscador-cliente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="input-buscar-cliente" type="text" placeholder="Buscar por cliente..." />
          </div>
          <div class="filtros-estado">
            <select id="select-filtro-entregado">
              <option value="">Entrega: todos</option>
              <option value="si">Entregado</option>
              <option value="no">No entregado</option>
            </select>
          </div>
        </div>
        <div id="lista-pedidos-admin"></div>
      </section>

      <!-- Tab Productos -->
      <section id="tab-productos" class="oculto">
        <button class="btn-agregar-producto-nuevo" id="btn-abrir-modal-producto">+ Agregar producto</button>
        <div class="buscador-cliente" style="margin-bottom:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="input-buscar-producto" type="text" placeholder="Buscar fruta o verdura..." />
        </div>
        <div id="lista-productos-admin"></div>
      </section>

      <!-- Tab Configuración -->
      <section id="tab-configuracion" class="oculto">
        <div class="form-nuevo-producto">
          <h3 style="margin:0;">Datos de la tienda</h3>
          <label>Teléfono de contacto (WhatsApp)</label>
          <input id="cfg-telefono" type="tel" placeholder="Ej: 1122334455" />
          <button id="btn-guardar-telefono">Guardar teléfono</button>
        </div>
        <div class="form-nuevo-producto">
          <h3 style="margin:0;">Cambiar contraseña</h3>
          <label>Contraseña actual</label>
          <input id="cfg-password-actual" type="password" autocomplete="off" />
          <label>Contraseña nueva</label>
          <input id="cfg-password-nueva" type="password" autocomplete="off" />
          <label>Repetir contraseña nueva</label>
          <input id="cfg-password-nueva-confirmar" type="password" autocomplete="off" />
          <p id="cfg-password-error" class="oculto" style="color:var(--rojo);font-size:12.5px;margin:8px 0 0;"></p>
          <button id="btn-cambiar-password">Cambiar contraseña</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal agregar producto -->
  <div id="modal-producto" class="modal-overlay oculto">
    <div class="modal-producto">
      <h3>Nuevo producto</h3>
      <label>Nombre</label>
      <input id="np-nombre" type="text" placeholder="Ej: Zanahoria" />
      <label>Categoría</label>
      <select id="np-categoria">
        <option value="verdura">Verdura</option>
        <option value="fruta">Fruta</option>
      </select>
      <label>Precio por kg</label>
      <input id="np-precio" type="number" min="0" step="10" placeholder="Ej: 1200" />
      <div class="modal-producto-acciones">
        <button type="button" id="modal-producto-cancelar" class="btn-modal-cancelar">Cancelar</button>
        <button type="button" id="btn-agregar-producto" style="background:var(--verde);color:#fff;">Agregar producto</button>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
