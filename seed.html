<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Seed — Verdulería Demo</title>
<style>
  body { font-family: sans-serif; padding: 30px; max-width: 560px; margin: auto; }
  button { padding: 12px 20px; font-size: 15px; background:#3a7d44; color:#fff; border:none; border-radius:8px; cursor:pointer; }
  #log { margin-top: 20px; font-size: 13px; white-space: pre-wrap; background:#f5f5f5; padding:14px; border-radius:8px; }
</style>
</head>
<body>
  <h2>⚠️ Página de un solo uso</h2>
  <p>Esto crea la verdulería <strong>demo</strong> (tienda de ejemplo) con ~20 frutas y verduras
  a precios placeholder, y su contraseña de admin. Usala una sola vez y después borrala del hosting.</p>
  <button id="btn-seed">Cargar datos de ejemplo</button>
  <div id="log"></div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const log = document.getElementById("log");
    const escribir = (t) => { log.textContent += t + "\n"; };

    const PRODUCTOS = [
      { nombre: "Manzana", categoria: "fruta", precioPorKg: 1800, emoji: "🍎" },
      { nombre: "Banana", categoria: "fruta", precioPorKg: 1500, emoji: "🍌" },
      { nombre: "Naranja", categoria: "fruta", precioPorKg: 1200, emoji: "🍊" },
      { nombre: "Mandarina", categoria: "fruta", precioPorKg: 1400, emoji: "🍊" },
      { nombre: "Pera", categoria: "fruta", precioPorKg: 2000, emoji: "🍐" },
      { nombre: "Limón", categoria: "fruta", precioPorKg: 900, emoji: "🍋" },
      { nombre: "Uva", categoria: "fruta", precioPorKg: 2600, emoji: "🍇" },
      { nombre: "Frutilla", categoria: "fruta", precioPorKg: 3200, emoji: "🍓" },
      { nombre: "Kiwi", categoria: "fruta", precioPorKg: 2800, emoji: "🥝" },
      { nombre: "Durazno", categoria: "fruta", precioPorKg: 2200, emoji: "🍑" },
      { nombre: "Papa", categoria: "verdura", precioPorKg: 900, emoji: "🥔" },
      { nombre: "Cebolla", categoria: "verdura", precioPorKg: 1100, emoji: "🧅" },
      { nombre: "Tomate", categoria: "verdura", precioPorKg: 1600, emoji: "🍅" },
      { nombre: "Zanahoria", categoria: "verdura", precioPorKg: 1000, emoji: "🥕" },
      { nombre: "Zapallito", categoria: "verdura", precioPorKg: 1300, emoji: "🥒" },
      { nombre: "Lechuga", categoria: "verdura", precioPorKg: 1400, emoji: "🥬" },
      { nombre: "Pimiento", categoria: "verdura", precioPorKg: 2100, emoji: "🫑" },
      { nombre: "Berenjena", categoria: "verdura", precioPorKg: 1700, emoji: "🍆" },
      { nombre: "Zapallo", categoria: "verdura", precioPorKg: 1200, emoji: "🎃" },
      { nombre: "Ajo", categoria: "verdura", precioPorKg: 4000, emoji: "🧄" },
      { nombre: "Batata", categoria: "verdura", precioPorKg: 1100, emoji: "🍠" },
      { nombre: "Choclo", categoria: "verdura", precioPorKg: 1300, emoji: "🌽" }
    ];

    document.getElementById("btn-seed").addEventListener("click", async () => {
      try {
        escribir("Autenticando...");
        await signInAnonymously(auth);

        escribir("Creando verdulería 'demo'...");
        await setDoc(doc(db, "verdulerias", "demo"), {
          nombre: "Verdulería Demo",
          slug: "demo",
          adminPassword: "1234",
          activa: true
        });

        escribir("Cargando productos...");
        for (const p of PRODUCTOS) {
          const ref = doc(collection(db, "verdulerias", "demo", "productos"));
          await setDoc(ref, { ...p, activo: true });
          escribir("  + " + p.nombre);
        }

        escribir("\n✅ Listo. Probá con:");
        escribir("Cliente: index.html?tienda=demo");
        escribir("Admin:   admin.html?tienda=demo  (contraseña: 1234)");
        escribir("\nRecordá borrar este archivo (seed.html) del hosting después de usarlo.");
      } catch (e) {
        escribir("❌ Error: " + e.message);
        console.error(e);
      }
    });
  </script>
</body>
</html>
